<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin ChimChum Malang</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:30px;
}

h1{
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:10px;
margin:5px 0 15px;
}

button{
padding:10px 15px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
}

img{
width:80px;
border-radius:8px;
}

.btn-delete{
background:red;
color:white;
border:none;
}

.btn-edit{
background:orange;
color:white;
border:none;
}

</style>

</head>

<body>

<h1>Admin Produk ChimChum Malang</h1>

<div class="card">

<h3>Tambah Produk</h3>

<input id="nama" placeholder="Nama Produk">

<input id="kategori" placeholder="Kategori">

<input id="isi" type="number" placeholder="Isi">

<input id="harga" type="number" placeholder="Harga">

<input id="stok" type="number" placeholder="Stok">

<input id="foto" placeholder="URL Foto GitHub">

<textarea id="deskripsi"
placeholder="Deskripsi"></textarea>

<button onclick="saveProduct()">
Simpan Produk
</button>

</div>

<table>

<thead>
<tr>
<th>Foto</th>
<th>Nama</th>
<th>Harga</th>
<th>Stok</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="productTable"></tbody>

</table>

<script type="module">

import {
db,
collection,
getDocs,
addDoc,
deleteDoc,
updateDoc,
doc
}
from './firebase.js';

const table =
document.getElementById("productTable");

window.loadProducts = async () => {

table.innerHTML="";

const snapshot =
await getDocs(collection(db,"products"));

snapshot.forEach((d)=>{

const p=d.data();

table.innerHTML += `
<tr>

<td>
<img src="${p.foto}">
</td>

<td>${p.nama}</td>

<td>
Rp ${Number(p.harga)
.toLocaleString('id-ID')}
</td>

<td>${p.stok}</td>

<td>

<button
class="btn-edit"
onclick="editProduct('${d.id}')">
Edit
</button>

<button
class="btn-delete"
onclick="deleteProduct('${d.id}')">
Hapus
</button>

</td>

</tr>
`;

});

};

window.saveProduct = async ()=>{

await addDoc(
collection(db,"products"),
{
nama:
document.getElementById("nama").value,

kategori:
document.getElementById("kategori").value,

isi:
Number(document.getElementById("isi").value),

harga:
Number(document.getElementById("harga").value),

stok:
Number(document.getElementById("stok").value),

foto:
document.getElementById("foto").value,

deskripsi:
document.getElementById("deskripsi").value,

aktif:true
}
);

alert("Produk berhasil ditambah");

location.reload();

};

window.deleteProduct =
async(id)=>{

if(!confirm("Hapus produk?"))
return;

await deleteDoc(
doc(db,"products",id)
);

loadProducts();

};

window.editProduct =
async(id)=>{

const harga =
prompt("Harga baru");

if(!harga) return;

await updateDoc(
doc(db,"products",id),
{
harga:Number(harga)
}
);

loadProducts();

};

loadProducts();

</script>

</body>

</html>
```
